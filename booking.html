<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BusGo — Преміум Бронювання Україна ⇄ Іспанія</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        
        body {
            background: #090d16;
            color: #f8fafc;
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(16, 185, 129, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(59, 130, 246, 0.08) 0%, transparent 40%);
            background-attachment: fixed;
        }

        .navbar {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding: 18px 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        .nav-flex { display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 24px; font-weight: 800; color: #fff; text-decoration: none; letter-spacing: -0.5px; }
        .logo span { color: #10b981; }
        .nav-links a { color: #94a3b8; text-decoration: none; margin-left: 24px; font-weight: 600; font-size: 14px; transition: 0.2s; }
        .nav-links a:hover { color: #10b981; }

        .booking-header { margin: 40px 0 24px; text-align: center; }
        .booking-header h1 { font-size: 32px; font-weight: 800; background: linear-gradient(135deg, #fff 0%, #94a3b8 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .booking-header p { color: #64748b; margin-top: 8px; font-size: 15px; }

        .booking-grid { display: grid; grid-template-columns: 1.2fr 1.8fr; gap: 32px; margin-bottom: 60px; }

        /* Glassmorphic Card */
        .glass-card {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 28px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }

        /* Анімована Карта-Трекер */
        .route-card {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.8) 0%, rgba(15, 23, 42, 0.9) 100%);
            border: 1px solid rgba(16, 185, 129, 0.2);
            position: relative;
            overflow: hidden;
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .route-card::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(16,185,129,0.05) 0%, transparent 60%);
            pointer-events: none;
        }

        .route-cities { display: flex; justify-content: space-between; align-items: center; position: relative; z-index: 2; }
        .city-tag { display: flex; flex-direction: column; }
        .city-tag .name { font-size: 20px; font-weight: 800; color: #fff; }
        .city-tag .country { font-size: 12px; color: #10b981; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }

        .route-line-container { position: relative; margin: 30px 0; height: 6px; background: rgba(255,255,255,0.1); border-radius: 10px; }
        .route-line-progress { position: absolute; height: 100%; background: linear-gradient(90deg, #10b981, #3b82f6); border-radius: 10px; width: 100%; }
        
        .animated-bus {
            position: absolute;
            top: -18px;
            font-size: 24px;
            filter: drop-shadow(0 0 10px #10b981);
            animation: busDrive 4s infinite ease-in-out;
        }

        @keyframes busDrive {
            0% { left: 5%; transform: scaleX(1); }
            50% { left: 85%; transform: scaleX(1); }
            51% { transform: scaleX(-1); }
            99% { left: 5%; transform: scaleX(-1); }
            100% { transform: scaleX(1); }
        }

        .pulse-dot {
            width: 12px; height: 12px; background: #10b981; border-radius: 50%;
            box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        /* Автобусний Салон */
        .bus-cockpit {
            text-align: center;
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            padding: 8px;
            margin-bottom: 20px;
            font-size: 12px;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
        }

        .seats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            max-width: 300px;
            margin: 0 auto;
        }

        .seat {
            height: 48px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 13px;
            color: #cbd5e1;
            cursor: pointer;
            transition: all 0.25s ease;
            position: relative;
        }

        .seat::after {
            content: '';
            position: absolute;
            top: 4px; width: 60%; height: 4px;
            background: rgba(255,255,255,0.2);
            border-radius: 4px;
        }

        .seat:hover:not(.occupied) {
            background: rgba(16, 185, 129, 0.2);
            border-color: #10b981;
            color: #fff;
            transform: translateY(-2px);
        }

        .seat.selected {
            background: #10b981 !important;
            border-color: #10b981 !important;
            color: #fff !important;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.5);
        }

        .seat.occupied {
            background: rgba(255, 255, 255, 0.02);
            border-color: transparent;
            color: #334155;
            cursor: not-allowed;
        }
        .seat.occupied::after { display: none; }

        .legend { display: flex; justify-content: center; gap: 20px; margin-top: 24px; font-size: 13px; color: #94a3b8; }
        .legend-item { display: flex; align-items: center; gap: 8px; }
        .legend-box { width: 14px; height: 14px; border-radius: 4px; }

        /* Форма Вводу */
        .form-section-title { font-size: 18px; font-weight: 700; margin-bottom: 20px; color: #fff; display: flex; align-items: center; gap: 10px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
        
        .field { display: flex; flex-direction: column; gap: 6px; }
        .field label { font-size: 12px; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .field input {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            padding: 14px 16px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
        }

        .field input:focus {
            border-color: #10b981;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
        }

        /* Підсумок Чек-аут */
        .summary-box {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            padding: 20px;
            margin: 24px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .btn-submit {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: #fff;
            border: none;
            width: 100%;
            padding: 18px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.3);
            transition: all 0.25s ease;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 35px rgba(16, 185, 129, 0.4);
        }

        @media (max-width: 900px) {
            .booking-grid { grid-template-columns: 1fr; }
            .form-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="container nav-flex">
            <a href="index.html" class="logo">Bus<span>Go</span></a>
            <div class="nav-links">
                <a href="index.html">Головна</a>
                <a href="search.html">Пошук рейсів</a>
                <a href="admin.html">Адмінка</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="booking-header">
            <h1>Бронювання місця на рейс</h1>
            <p>Оберіть найкраще місце в салоні та заповніть контактні дані</p>
        </div>

        <div class="booking-grid">
            
            <!-- Ліва колонка: Інтерактивний автобус -->
            <div>
                <!-- Трек маршруту -->
                <div class="route-card">
                    <div class="route-cities">
                        <div class="city-tag">
                            <span class="country">Україна 🇺🇦</span>
                            <span class="name" id="route-from">Львів</span>
                        </div>
                        <div class="pulse-dot"></div>
                        <div class="city-tag" style="text-align: right;">
                            <span class="country">Іспанія 🇪🇸</span>
                            <span class="name" id="route-to">Барселона</span>
                        </div>
                    </div>

                    <div class="route-line-container">
                        <div class="route-line-progress"></div>
                        <div class="animated-bus">🚌</div>
                    </div>

                    <div style="display: flex; justify-content: space-between; font-size: 12px; color: #94a3b8;">
                        <span>Прямий рейс</span>
                        <span>Комфорт-клас</span>
                    </div>
                </div>

                <!-- Салон -->
                <div class="glass-card">
                    <div class="bus-cockpit">️ Водій / Кабіна</div>
                    
                    <div class="seats-grid" id="seats-container"></div>

                    <div class="legend">
                        <div class="legend-item"><div class="legend-box" style="background: rgba(255,255,255,0.1);"></div> Вільне</div>
                        <div class="legend-item"><div class="legend-box" style="background: #10b981;"></div> Обране</div>
                        <div class="legend-item"><div class="legend-box" style="background: rgba(255,255,255,0.02);"></div> Зайнято</div>
                    </div>
                </div>
            </div>

            <!-- Права колонка: Форма -->
            <div class="glass-card">
                <div class="form-section-title">👤 Інформація про пасажира</div>

                <form id="booking-form">
                    <div class="form-row">
                        <div class="field">
                            <label>Ім'я</label>
                            <input type="text" id="fname" placeholder="Олександр" required>
                        </div>
                        <div class="field">
                            <label>Прізвище</label>
                            <input type="text" id="lname" placeholder="Ковальчук" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="field">
                            <label>Телефон (Viber / WhatsApp)</label>
                            <input type="tel" id="phone" placeholder="+380 67 123 4567" required>
                        </div>
                        <div class="field">
                            <label>Email адреса</label>
                            <input type="email" id="email" placeholder="example@gmail.com" required>
                        </div>
                    </div>

                    <div class="field" style="margin-bottom: 20px;">
                        <label>Дата виїзду</label>
                        <input type="date" id="booking-date" required>
                    </div>

                    <div class="summary-box">
                        <div>
                            <span style="font-size: 12px; color: #94a3b8; text-transform: uppercase; font-weight: 700;">Місця:</span>
                            <div id="selected-seats-display" style="font-size: 20px; font-weight: 800; color: #fff; margin-top: 2px;">Не обрано</div>
                        </div>
                        <div style="text-align: right;">
                            <span style="font-size: 12px; color: #94a3b8; text-transform: uppercase; font-weight: 700;">Разом до сплати:</span>
                            <div id="total-price-display" style="font-size: 28px; font-weight: 800; color: #10b981; margin-top: 2px;">0 грн</div>
                        </div>
                    </div>

                    <button type="submit" class="btn-submit">Підтвердити бронювання ✨</button>
                </form>
            </div>

        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const from = urlParams.get('from') || 'Львів';
            const to = urlParams.get('to') || 'Барселона';
            const ticketPrice = Number(urlParams.get('price')) || 4600;
            const paramDate = urlParams.get('date');

            document.getElementById('route-from').textContent = from;
            document.getElementById('route-to').textContent = to;

            const dateInput = document.getElementById('booking-date');
            const today = new Date().toISOString().split('T')[0];
            dateInput.min = today;
            dateInput.value = paramDate || today;

            const seatsContainer = document.getElementById('seats-container');
            const seatsDisplay = document.getElementById('selected-seats-display');
            const priceDisplay = document.getElementById('total-price-display');

            let selectedSeats = [];

            // Генеруємо 32 місця
            for (let i = 1; i <= 32; i++) {
                const seat = document.createElement('div');
                seat.className = 'seat';
                seat.textContent = i;

                if ([3, 7, 12, 18, 22].includes(i)) {
                    seat.classList.add('occupied');
                } else {
                    seat.addEventListener('click', () => {
                        if (selectedSeats.includes(i)) {
                            selectedSeats = selectedSeats.filter(s => s !== i);
                            seat.classList.remove('selected');
                        } else {
                            selectedSeats.push(i);
                            seat.classList.add('selected');
                        }
                        updateSummary();
                    });
                }
                seatsContainer.appendChild(seat);
            }

            function updateSummary() {
                if (selectedSeats.length > 0) {
                    seatsDisplay.textContent = selectedSeats.join(', ');
                    priceDisplay.textContent = (selectedSeats.length * ticketPrice).toLocaleString() + ' грн';
                } else {
                    seatsDisplay.textContent = 'Не обрано';
                    priceDisplay.textContent = '0 грн';
                }
            }

            const TELEGRAM_BOT_TOKEN = 'YOUR_BOT_TOKEN'; 
            const TELEGRAM_CHAT_ID = 'YOUR_CHAT_ID';     

            document.getElementById('booking-form').addEventListener('submit', (e) => {
                e.preventDefault();

                if (selectedSeats.length === 0) {
                    alert('Будь ласка, торкніться та оберіть принаймні одне місце в автобусі!');
                    return;
                }

                const fname = document.getElementById('fname').value;
                const lname = document.getElementById('lname').value;
                const phone = document.getElementById('phone').value;
                const email = document.getElementById('email').value;
                const date = document.getElementById('booking-date').value;
                const totalPrice = selectedSeats.length * ticketPrice;

                // Локальне збереження в адмінку
                const existingBookings = JSON.parse(localStorage.getItem('bus_user_bookings') || '[]');
                existingBookings.push({ fname, lname, phone, email, date, from, to, seats: selectedSeats, totalPrice });
                localStorage.setItem('bus_user_bookings', JSON.stringify(existingBookings));

                // Відправка в Telegram
                if (TELEGRAM_BOT_TOKEN !== 'YOUR_BOT_TOKEN') {
                    const message = `🚌 *НОВЕ БРОНЮВАННЯ*\n\n📍 ${from} ➔ ${to}\n📅 Дата: ${date}\n👤 Пасажир: ${fname} ${lname}\n📞 Тел: ${phone}\n✉️ Email: ${email}\n💺 Місця: ${selectedSeats.join(', ')}\n💰 Сума: ${totalPrice} грн`;
                    fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text: message, parse_mode: 'Markdown' })
                    });
                }

                alert(`🎉 Дякуємо, ${fname}! Ваше бронювання успішно оформлено!`);
            });
        });
    </script>
</body>
</html>
