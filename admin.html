<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BusGo — Управління рейсами Україна ⇄ Іспанія</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .admin-container { padding: 40px 0; }
        .admin-grid { display: grid; grid-template-columns: 1fr 2fr; gap: 32px; }
        .admin-card { background: #fff; padding: 24px; border-radius: 16px; border: 1px solid #e2e8f0; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; }
        .route-table { width: 100%; border-collapse: collapse; margin-top: 16px; }
        .route-table th, .route-table td { padding: 12px; text-align: left; border-bottom: 1px solid #e2e8f0; font-size: 14px; }
        .btn-delete { background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
        .badge-country { font-size: 11px; padding: 3px 8px; border-radius: 6px; font-weight: 700; }
        .badge-ua { background: #dbeafe; color: #1e40af; }
        .badge-es { background: #fef3c7; color: #92400e; }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="container navbar-container">
            <a href="index.html" class="logo">Bus<span>Go</span> <small style="font-size: 12px; color: #64748b;">(Україна ⇄ Іспанія Admin)</small></a>
            <a href="index.html" class="btn-secondary">← На сайт</a>
        </div>
    </header>

    <div class="container admin-container">
        <h1 style="margin-bottom: 8px;">Керування цінами та рейсами</h1>
        <p style="color: #64748b; margin-bottom: 24px;">Встановлюйте індивідуальні ціни між містами України та Іспанії</p>
        
        <div class="admin-grid">
            <!-- Форма додавання ціни між містами -->
            <div class="admin-card">
                <h3>Додати / Оновити ціну рейсів</h3>
                <form id="add-route-form" style="margin-top: 16px;">
                    <div class="form-group">
                        <label>Напрямок руху</label>
                        <select id="direction-select" onchange="updateCityDropdowns()">
                            <option value="UA_ES">Україна ➔ Іспанія 🇪🇸</option>
                            <option value="ES_UA">Іспанія 🇪🇸 ➔ Україна 🇺🇦</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Місто виїзду</label>
                        <select id="admin-from" required></select>
                    </div>

                    <div class="form-group">
                        <label>Місто прибуття</label>
                        <select id="admin-to" required></select>
                    </div>

                    <div class="form-group">
                        <label>Час виїзду (місцевий)</label>
                        <input type="time" id="admin-time" value="09:00" required>
                    </div>

                    <div class="form-group">
                        <label>Тривалість поїздки (годин)</label>
                        <input type="number" id="admin-duration" placeholder="32" value="34" required>
                    </div>

                    <div class="form-group">
                        <label>Ціна квитка (грн або €)</label>
                        <input type="number" id="admin-price" placeholder="4800" required>
                    </div>

                    <div class="form-group">
                        <label>Дні відправлення</label>
                        <input type="text" id="admin-days" placeholder="Вівторок, П'ятниця" value="Вт, Пт, Нд">
                    </div>

                    <button type="submit" class="btn-primary" style="width: 100%;">Зберегти рейс та ціну</button>
                </form>
            </div>

            <!-- Таблиця наявних цінових зв'язків -->
            <div class="admin-card">
                <h3>Активні маршрути та ціни</h3>
                <table class="route-table">
                    <thead>
                        <tr>
                            <th>Маршрут</th>
                            <th>Час / Тривалість</th>
                            <th>Ціна</th>
                            <th>Дія</th>
                        </tr>
                    </thead>
                    <tbody id="routes-list"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const ukraineCities = ['Київ', 'Львів', 'Житомир', 'Рівне', 'Тернопіль', 'Івано-Франківськ', 'Ужгород'];
        const spainCities = ['Барселона', 'Мадрид', 'Валенсія', 'Аліканте', 'Жирона', 'Мурсія', 'Малага'];

        const defaultRoutes = [
            { id: 1, from: 'Київ', to: 'Барселона', time: '07:00', duration: 36, price: 5200, days: 'Вт, Пт', dir: 'UA_ES' },
            { id: 2, from: 'Львів', to: 'Барселона', time: '13:00', duration: 30, price: 4600, days: 'Вт, Пт', dir: 'UA_ES' },
            { id: 3, from: 'Львів', to: 'Мадрид', time: '13:00', duration: 38, price: 5000, days: 'Ср, Сб', dir: 'UA_ES' },
            { id: 4, from: 'Барселона', to: 'Львів', time: '10:00', duration: 30, price: 4600, days: 'Чт, Нд', dir: 'ES_UA' },
            { id: 5, from: 'Барселона', to: 'Київ', time: '10:00', duration: 36, price: 5200, days: 'Чт, Нд', dir: 'ES_UA' }
        ];

        function updateCityDropdowns() {
            const dir = document.getElementById('direction-select').value;
            const fromSelect = document.getElementById('admin-from');
            const toSelect = document.getElementById('admin-to');

            fromSelect.innerHTML = '';
            toSelect.innerHTML = '';

            const fromList = dir === 'UA_ES' ? ukraineCities : spainCities;
            const toList = dir === 'UA_ES' ? spainCities : ukraineCities;

            fromList.forEach(c => fromSelect.innerHTML += `<option value="${c}">${c}</option>`);
            toList.forEach(c => toSelect.innerHTML += `<option value="${c}">${c}</option>`);
        }

        function getRoutes() {
            const saved = localStorage.getItem('bus_routes_es');
            return saved ? JSON.parse(saved) : defaultRoutes;
        }

        function renderRoutes() {
            const routes = getRoutes();
            const tbody = document.getElementById('routes-list');
            tbody.innerHTML = '';

            routes.forEach(route => {
                const tr = document.createElement('tr');
                const isUAtoES = route.dir === 'UA_ES';
                tr.innerHTML = `
                    <td>
                        <strong>${route.from} ➔ ${route.to}</strong><br>
                        <span class="badge-country ${isUAtoES ? 'badge-ua' : 'badge-es'}">${isUAtoES ? 'UA ➔ ES' : 'ES ➔ UA'}</span>
                        <small style="color: #64748b;">Дні: ${route.days}</small>
                    </td>
                    <td>${route.time} (${route.duration} год)</td>
                    <td><strong style="color: #10b981;">${route.price} грн</strong></td>
                    <td><button class="btn-delete" onclick="deleteRoute(${route.id})">Видалити</button></td>
                `;
                tbody.appendChild(tr);
            });
        }

        document.getElementById('add-route-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const routes = getRoutes();
            const dir = document.getElementById('direction-select').value;
            const newRoute = {
                id: Date.now(),
                from: document.getElementById('admin-from').value,
                to: document.getElementById('admin-to').value,
                time: document.getElementById('admin-time').value,
                duration: Number(document.getElementById('admin-duration').value),
                price: Number(document.getElementById('admin-price').value),
                days: document.getElementById('admin-days').value,
                dir: dir
            };
            routes.push(newRoute);
            localStorage.setItem('bus_routes_es', JSON.stringify(routes));
            renderRoutes();
        });

        function deleteRoute(id) {
            let routes = getRoutes();
            routes = routes.filter(r => r.id !== id);
            localStorage.setItem('bus_routes_es', JSON.stringify(routes));
            renderRoutes();
        }

        updateCityDropdowns();
        renderRoutes();
    </script>
</body>
</html>
